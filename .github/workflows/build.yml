name: Emmy Debugger Core

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux, platform: linux-x64}
          - { os: ubuntu-24.04-arm, target: linux, platform: linux-arm64}
          - { os: macos-latest, target: darwin, platform: darwin-x64}
          - { os: macos-latest, target: darwin, platform: darwin-arm64}
    steps:
    - name: Env
      # set TAG=DEV if not a tag
      run: |
          if [[ ${{ github.ref }} = refs/tags/* ]]; then
            export TAG=$(echo ${{ github.ref }} | sed -e "s/refs\/tags\///g")
          else
            export TAG=DEV
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
      
      shell: bash
    - name: Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install-tarantool-linux
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        curl -L https://tarantool.io/release/3/installer.sh | bash
        sudo apt-get -y install tarantool-dev
        sudo mkdir -p /usr/local/lib/tarantool
    - name: Build-linux
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        if [[ "${{ matrix.zig_build }}" == "true" ]]; then
          sudo snap install zig --classic --beta
          mkdir -p build
          # 使用zig-build.cmake配置文件编译C++项目
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEMMY_CORE_VERSION=${{env.TAG}}
          cmake --build build --config Release
          cmake --install build --config Release --prefix ${{ github.workspace }}/artifact/
        else
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DEMMY_CORE_VERSION=${{env.TAG}}
          cmake --build . --config Release
          cmake --install . --config Release --prefix ${{ github.workspace }}/artifact/
        fi
    - name: Install-tarantool-macos
      if: startsWith(matrix.os, 'macos')
      run: |
        brew install tarantool
        sudo mkdir -p /usr/local/lib/tarantool
    - name: Build-macosx
      if: startsWith(matrix.os, 'macos')
      run: |
        mkdir build
        cd build
        if [[ "${{ matrix.platform }}" = darwin-arm64 ]]; then
          cmake .. -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_BUILD_TYPE=Release -DEMMY_CORE_VERSION=${{env.TAG}}
        else
          cmake .. -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_BUILD_TYPE=Release -DEMMY_CORE_VERSION=${{env.TAG}}
        fi
        cmake --build . --config Release
        cmake --install . --config Release --prefix ${{ github.workspace }}/artifact/


    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}
        path: ${{ github.workspace }}/artifact/bin
 
  upload-release:
    name: Upload Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: [ubuntu-latest]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download
        uses: actions/download-artifact@v4
      - name: Display structure of downloaded files
        run: ls -R   
      - name: zip win32-x64
        uses: TheDoctor0/zip-release@master
        with:
          filename: win32-x64.zip
          directory: win32-x64
          path: |
            EasyHook.dll
            emmy_core.dll
            emmy_hook.dll
            emmy_tool.exe

      - name: zip win32-x86
        uses: TheDoctor0/zip-release@master
        with:
          filename: win32-x86.zip
          directory: win32-x86
          path: |
            EasyHook.dll
            emmy_core.dll
            emmy_hook.dll
            emmy_tool.exe
      - name: zip linux-x64
        uses: TheDoctor0/zip-release@master
        with:
          filename: linux-x64.zip
          directory: linux-x64
          path: emmy_core.so
      - name: zip darwin-x64
        uses: TheDoctor0/zip-release@master
        with:
          filename: darwin-x64.zip
          directory: darwin-x64
          path: emmy_core.dylib   
      - name: zip darwin-arm64
        uses: TheDoctor0/zip-release@master
        with:
          filename: darwin-arm64.zip
          directory: darwin-arm64
          path: emmy_core.dylib
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: EmmyLuaDebugger
          draft: false
          generate_release_notes: true
          files: |
            win32-x64/win32-x64.zip
            win32-x86/win32-x86.zip
            darwin-arm64/darwin-arm64.zip
            darwin-x64/darwin-x64.zip
            linux-x64/linux-x64.zip
          token: ${{ secrets.RELEASE }}
